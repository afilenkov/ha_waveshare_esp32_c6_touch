################################################################################
# https://www.waveshare.com/wiki/ESP32-C6-Touch-LCD-1.47
# https://www.waveshare.com/product/arduino/boards-kits/esp32-c6/esp32-c6-touch-lcd-1.47.htm
################################################################################

substitutions:
  device_internal_name: waveshare_esp32_c6_touch
  device_friendly_name: ESP32-C6-Touch
  font: gfonts://Roboto
  mdi: fonts/materialdesignicons-webfont.ttf 
  characters: " !#%'()+,-./0123456789:;<>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz{|}°²³µ$"
  device_sampling_time: 30s

esphome:
  name: ${device_internal_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    then:
      - switch.turn_on: screen_switch

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

################################################################################
# External Components
################################################################################
external_components:
  - source: github://widget/esphome-components
    components: [ axs5106 ]
    refresh: 0s


################################################################################
# Globals
################################################################################
globals: 
  - id: screen_index
    type: int
    restore_value: no
    initial_value: '0'

################################################################################
# Enable logging
################################################################################
logger:
  logs:
    component: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key2
  on_client_connected:
    - if:
        condition:
          - lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: ha_connected_title
          
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: ha_connected_title

################################################################################
# OTA
################################################################################
ota:
  platform: esphome
  password: !secret web_server_password

################################################################################
# WiFi
################################################################################
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  on_connect:
    - lvgl.label.update:
        id: wifi_icon
        text: "\U000F05A9"
  on_disconnect:
    - lvgl.label.update:
        id: wifi_icon
        text: "\U000F16C5"

################################################################################
# SPI
################################################################################

spi:
  clk_pin: GPIO1
  mosi_pin: GPIO2

################################################################################
# I2C for touchscreen
################################################################################
i2c:
  sda: GPIO18
  scl: GPIO19
  frequency: 400kHz
  scan: false
  id: bus_a
################################################################################
# DISPLAY
################################################################################

display:
  - platform: ili9xxx
    model: ST7789V
    dc_pin: GPIO15
    cs_pin: GPIO14
    reset_pin: GPIO22
    dimensions:
      width: 320
      height: 172
      offset_height: 34
      offset_width: 0
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    invert_colors: false
    data_rate: 40MHz
    color_order: bgr
    update_interval: 1s

# Screen ON/OFF Switch
switch:
  - platform: template
    name: "Screen ON/OFF"
    id: screen_switch
    turn_on_action:
      - output.turn_on: lcd_backlight
    turn_off_action:
      - output.turn_off: lcd_backlight
    optimistic: true

output:
  - platform: gpio
    id: lcd_backlight
    pin: GPIO23
    inverted: false

################################################################################
# touchscreen
################################################################################

touchscreen:
  platform: axs5106
  id: my_touchscreen
  interrupt_pin: 21
  reset_pin: 20
  on_touch:
      - lambda: |-
          ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
      - script.execute: next_screen

################################################################################
# time
################################################################################
time:
  - platform: homeassistant
    id: time_comp
    #timezone: America/Los_Angeles
    # - time.bora.net
    # - time.windows.com
    on_time_sync:
      - script.execute: time_update
      - script.execute: date_update
    on_time:
      - minutes: '*'
        seconds: '*'
        then:
          - script.execute: time_update
          - script.execute: date_update


################################################################################
# script
################################################################################
script:
  # Time update  
  - id: time_update
    then:
      - lvgl.label.update:
          id: title_time
          text: !lambda |-
            static char time_buf[17];
            auto now = id(time_comp).now();
            bool is_pm = now.hour >= 12;
            int hour_12 = now.hour % 12;
            if (hour_12 == 0) {
                hour_12 = 12; // 12 AM/PM should be displayed as 12, not 0
            }
            snprintf(time_buf, sizeof(time_buf), "%s %2d:%02d:%02d", is_pm ? "PM" : "AM", hour_12, now.minute,now.second );
            return time_buf;      

  - id: date_update
    then:
      #- lvgl.label.update:
      #    id: title_date
      #    text: !lambda |-
      #      static char date_buf[30];
      #      auto now = id(time_comp).now();
      #      const char* weekdays[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
      #      snprintf(date_buf, sizeof(date_buf), "%04d-%02d-%02d (%s)", now.year, now.month, now.day_of_month, weekdays[now.day_of_week - 1]);
      #      return date_buf;

  - id: next_screen
    then:
      - lambda: |-
          id(screen_index) +=1;
          if (id(screen_index) > 1)
          {
            id(screen_index) =0;
          };

      - if:
          condition:
            - lambda: 'return (0==id(screen_index));'
          then:
            - lvgl.widget.hide: battery_card2
            - lvgl.widget.show: import_card2

      - if:
          condition:
            - lambda: 'return (1==id(screen_index));'
          then:
            - lvgl.widget.hide: import_card2
            - lvgl.widget.show: battery_card2

  - id: battery_update
    then:
      - lvgl.label.update:
          id: house_battery_power_text_icon1
          text: !lambda |-
            auto battery_state = id(luxpower_lxp_battery_state_of_charge).state;
            if (battery_state<10) { return "\U000F007A"; } else
            if (battery_state<20) { return "\U000F007B"; } else
            if (battery_state<30) { return "\U000F007C"; } else
            if (battery_state<40) { return "\U000F007D"; } else
            if (battery_state<50) { return "\U000F007E"; } else
            if (battery_state<60) { return "\U000F007F"; } else
            if (battery_state<70) { return "\U000F0080"; } else
            if (battery_state<80) { return "\U000F0081"; } else
            if (battery_state<90) { return "\U000F0082"; } else 
            { return "\U000F0079"; };

################################################################################
# Float number sensors
# NOTE: text output sensors are below this section
################################################################################
sensor:
  # WiFi
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: ${device_internal_name}_wifi_signal_sensor
    update_interval: ${device_sampling_time}

  - platform: homeassistant
    id: luxpower_lxp_pv_power
    entity_id: sensor.luxpower_lxp_pv_power
    on_value:
      - lvgl.label.update:
          id: luxpower_lxp_pv_power_text3
          text:
            format: "%.0fW"
            args: [ 'x' ]  

  ## total solar power
  - platform: homeassistant
    id: total_solar_power_w
    entity_id: sensor.daily_pv_energy
    on_value:
      - lvgl.label.update:
          id: daily_luxpower_lxp_pv_power_text2
          text:
            format: "%.2fKWh"
            args: [ 'x' ]

  - platform: homeassistant
    id: house_battery_power
    entity_id: sensor.luxpower_lxp_battery_power
    on_value:
      - lvgl.label.update:
          id: house_battery_power_text2
          text:
            format: "%.0fW"
            args: [ 'x' ]  

  - platform: homeassistant
    id: luxpower_lxp_battery_state_of_charge
    entity_id: sensor.luxpower_lxp_battery_state_of_charge
    on_value:
      - script.execute: battery_update
      - lvgl.label.update:
          id: luxpower_lxp_battery_state_of_charge_text
          text:
            format: "%.0f%%"
            args: [ 'x' ]  

  - platform: homeassistant
    id: yearly_pv_energy
    entity_id: sensor.yearly_pv_energy
    on_value:
      then:
        - sensor.template.publish:
            id: yearly_pv_energy_cost
            state: !lambda |-
              return x*0.171822;  

  - platform: template
    id: yearly_pv_energy_cost
    on_value:
      - lvgl.label.update:
          id: yearly_pv_cost2
          text:
            format: "$%.2f"
            args: [ 'x' ]

